name: Refine QSearch Delta Pruning

on:
  push:
    branches:
      - feature/qsearch-delta-pruning

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qsearch-delta-pruning

      - name: Refine delta pruning implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/search.cpp')
          text = p.read_text()

          old = '''        const int originalAlpha = alpha;\n        const bool inCheckNode = pos.inCheck();\n        const auto& tuning = Tuning::search();\n\n        TTProbe ttProbe;\n'''
          new = '''        const int originalAlpha = alpha;\n        const bool inCheckNode = pos.inCheck();\n\n        TTProbe ttProbe;\n'''
          if text.count(old) != 1:
              raise SystemExit('unable to move tuning lookup')
          text = text.replace(old, new, 1)

          old = '''        if (!inCheckNode && !pvNode) {\n            const bool mateWindow = !(alpha > -MATE_THRESHOLD && beta < MATE_THRESHOLD);\n            const Color partner = static_cast<Color>(\n                static_cast<unsigned>(pos.sideToMove()) ^ 2u);\n'''
          new = '''        if (!inCheckNode && !pvNode) {\n            const auto& tuning = Tuning::search();\n            const bool mateWindow = !(alpha > -MATE_THRESHOLD && beta < MATE_THRESHOLD);\n            const Color partner = static_cast<Color>(\n                static_cast<unsigned>(pos.sideToMove()) ^ 2u);\n'''
          if text.count(old) != 1:
              raise SystemExit('unable to insert local tuning lookup')
          text = text.replace(old, new, 1)

          old = '''                    if ((move.isCapture() && isTerminalKingCapture(pos, move))\n                        || move.isPromotion()\n                        || pos.givesCheck(move)) {\n'''
          new = '''                    if (move == ttMove\n                        || (move.isCapture() && isTerminalKingCapture(pos, move))\n                        || move.isPromotion()\n                        || pos.givesCheck(move)) {\n'''
          if text.count(old) != 1:
              raise SystemExit('unable to add TT move exclusion')
          text = text.replace(old, new, 1)

          old = '''        // non-PV nodes and disabled for checks on either allied king, mate-score\n        // windows, promotions, checking moves, and immediate king captures.\n'''
          new = '''        // non-PV nodes and disabled for checks on either allied king, mate-score\n        // windows, the TT move, promotions, checking moves, and immediate king captures.\n'''
          if text.count(old) != 1:
              raise SystemExit('unable to update delta comment')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/search.cpp
          git commit -m "Refine QSearch delta pruning safety gates"
          git push origin HEAD:feature/qsearch-delta-pruning
