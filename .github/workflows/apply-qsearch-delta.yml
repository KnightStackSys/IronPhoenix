name: Apply QSearch Delta Pruning Patch

on:
  push:
    branches:
      - feature/qsearch-delta-pruning

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qsearch-delta-pruning

      - name: Apply delta pruning changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "include/ironphoenix/tuning.hpp",
              "            int seePruneMarginPerDepth = 80;\n            int historyBonusScale = 64;",
              "            int seePruneMarginPerDepth = 80;\n            int qsearchDeltaMargin = 250;\n            int historyBonusScale = 64;"
          )

          replace_once(
              "src/tuning.cpp",
              "                || name == \"SearchSEEPruneMargin\"\n                || name == \"SearchHistoryBonusScale\"",
              "                || name == \"SearchSEEPruneMargin\"\n                || name == \"SearchQSearchDeltaMargin\"\n                || name == \"SearchHistoryBonusScale\""
          )

          replace_once(
              "src/tuning.cpp",
              "        else if (name == \"SearchSEEPruneMargin\" && inRange(value, 0, 2000))\n            p.seePruneMarginPerDepth = value;\n        else if (name == \"SearchHistoryBonusScale\" && inRange(value, 0, 2048))",
              "        else if (name == \"SearchSEEPruneMargin\" && inRange(value, 0, 2000))\n            p.seePruneMarginPerDepth = value;\n        else if (name == \"SearchQSearchDeltaMargin\" && inRange(value, 0, 5000))\n            p.qsearchDeltaMargin = value;\n        else if (name == \"SearchHistoryBonusScale\" && inRange(value, 0, 2048))"
          )

          replace_once(
              "src/tuning.cpp",
              "            << \"option name SearchSEEPruneMargin type spin default 80 min 0 max 2000\\n\"\n            << \"option name SearchHistoryBonusScale type spin default 64 min 0 max 2048\\n\"",
              "            << \"option name SearchSEEPruneMargin type spin default 80 min 0 max 2000\\n\"\n            << \"option name SearchQSearchDeltaMargin type spin default 250 min 0 max 5000\\n\"\n            << \"option name SearchHistoryBonusScale type spin default 64 min 0 max 2048\\n\""
          )

          replace_once(
              "src/tuning.cpp",
              "            << \" SearchSEEPruneMargin=\" << s.seePruneMarginPerDepth\n            << \" SearchHistoryBonusScale=\" << s.historyBonusScale",
              "            << \" SearchSEEPruneMargin=\" << s.seePruneMarginPerDepth\n            << \" SearchQSearchDeltaMargin=\" << s.qsearchDeltaMargin\n            << \" SearchHistoryBonusScale=\" << s.historyBonusScale"
          )

          replace_once(
              "src/search.cpp",
              "        const int originalAlpha = alpha;\n        const bool inCheckNode = pos.inCheck();\n\n        TTProbe ttProbe;",
              "        const int originalAlpha = alpha;\n        const bool inCheckNode = pos.inCheck();\n        const auto& tuning = Tuning::search();\n\n        TTProbe ttProbe;"
          )

          old = '''        MoveList moves;\n        if (inCheckNode)\n            generatePseudoLegalMoves(pos, moves);\n        else\n            generateTacticalMoves(pos, moves);\n\n        orderMoves(pos, moves.begin(), moves.end(), ttMove, ply);\n'''

          new = '''        MoveList moves;\n        if (inCheckNode)\n            generatePseudoLegalMoves(pos, moves);\n        else\n            generateTacticalMoves(pos, moves);\n\n        // Position-level delta pruning (\"big delta\") for QSearch. If even\n        // the best plausible non-forcing material gain cannot raise alpha, the\n        // whole tactical continuation can be skipped before move ordering/search.\n        //\n        // 4PC is tactically volatile, so this is deliberately restricted to\n        // non-PV nodes and disabled for checks on either allied king, mate-score\n        // windows, promotions, checking moves, and immediate king captures.\n        if (!inCheckNode && !pvNode) {\n            const bool mateWindow = !(alpha > -MATE_THRESHOLD && beta < MATE_THRESHOLD);\n            const Color partner = static_cast<Color>(\n                static_cast<unsigned>(pos.sideToMove()) ^ 2u);\n\n            // A queen is the largest ordinary capturable piece. Use it as a cheap\n            // first gate so we only scan tactical moves for forcing exceptions\n            // when a node-level delta cutoff is actually possible.\n            if (!mateWindow\n                && !pos.inCheck(partner)\n                && bestScore + pieceValue(QUEEN) + tuning.qsearchDeltaMargin <= alpha) {\n\n                int maxGain = 0;\n                bool hasForcingTactic = false;\n\n                for (Move move : moves) {\n                    if ((move.isCapture() && isTerminalKingCapture(pos, move))\n                        || move.isPromotion()\n                        || pos.givesCheck(move)) {\n                        hasForcingTactic = true;\n                        break;\n                    }\n\n                    if (move.isCapture())\n                        maxGain = std::max(maxGain, pieceValue(move.captured()));\n                }\n\n                if (!hasForcingTactic\n                    && bestScore + maxGain + tuning.qsearchDeltaMargin <= alpha) {\n                    // Do not store this heuristic cutoff in the TT. Returning the\n                    // fail-low stand-pat score keeps the TT free of speculative\n                    // bounds while preserving fail-soft behavior.\n                    return bestScore;\n                }\n            }\n        }\n\n        orderMoves(pos, moves.begin(), moves.end(), ttMove, ply);\n'''
          replace_once("src/search.cpp", old, new)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/search.cpp src/tuning.cpp include/ironphoenix/tuning.hpp
          git commit -m "Add position-level delta pruning to qsearch"
          git push origin HEAD:feature/qsearch-delta-pruning
